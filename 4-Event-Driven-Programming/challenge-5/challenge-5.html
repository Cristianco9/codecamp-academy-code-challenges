<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 5 - Interactive To-Do List</title>
    <link rel="stylesheet" href="./challenge-5.css">
</head>
<body>

    <main class="container">

        <h1>Interactive To-Do List</h1>

        <div class="controls">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task..."
            >

            <button id="add-btn">
                Add Task
            </button>
        </div>

        <ul id="task-list"></ul>

    </main>

    <script src="./challenge-5.js"></script>

</body>
</html>
