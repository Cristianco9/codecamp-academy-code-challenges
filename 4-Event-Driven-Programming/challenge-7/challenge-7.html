<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 7 - Product Search</title>
    <link rel="stylesheet" href="./challenge-7.css">
</head>
<body>

    <main class="container">

        <h1>Product Catalog</h1>

        <p>
            Search products by name.
        </p>

        <input
            id="search-input"
            type="text"
            placeholder="Search products..."
            autocomplete="off"
        >

        <p id="result-count">
            Products found: 8
        </p>

        <ul id="product-list">
            <li>Laptop</li>
            <li>Wireless Mouse</li>
            <li>Mechanical Keyboard</li>
            <li>Gaming Monitor</li>
            <li>USB-C Hub</li>
            <li>External SSD</li>
            <li>Webcam HD</li>
            <li>Bluetooth Headphones</li>
        </ul>

    </main>

    <script src="./challenge-7.js"></script>

</body>
</html>
