<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 6 - Live Character Counter</title>
    <link rel="stylesheet" href="./challenge-6.css">
</head>
<body>

    <main class="container">

        <h1>Live Character Counter</h1>

        <textarea
            id="message"
            placeholder="Type your message here..."
        ></textarea>

        <p class="counter">
            Characters:
            <span id="count">0</span> / 100
        </p>

        <p id="status" class="normal">
            Start typing...
        </p>

    </main>

    <script src="./challenge-6.js"></script>

</body>
</html>
