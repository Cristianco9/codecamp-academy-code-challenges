<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 4 - Interactive Text Size Controller</title>
    <link rel="stylesheet" href="./challenge-4.css">
</head>
<body>

    <main class="container">

        <h1>Interactive Text Size Controller</h1>

        <p id="message">
            Event-driven programming allows web pages to respond instantly to
            user interactions. Use the buttons below to change the size of this
            paragraph.
        </p>

        <div class="buttons">
            <button id="increase-btn">
                Increase
            </button>

            <button id="decrease-btn">
                Decrease
            </button>

            <button id="reset-btn">
                Reset
            </button>
        </div>

        <p class="size">
            Current Size:
            <span id="size-value">16</span>px
        </p>

    </main>

    <script src="./challenge-4.js"></script>

</body>
</html>
